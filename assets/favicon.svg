<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4CAF50"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#81C784"/>
      <stop offset="100%" stop-color="#43A047"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB74D"/>
      <stop offset="100%" stop-color="#F57C00"/>
    </linearGradient>
    <linearGradient id="appleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF5350"/>
      <stop offset="100%" stop-color="#C62828"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#143916" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Squircle Base Icon Background -->
  <rect width="128" height="128" rx="34" fill="url(#bgGrad)"/>

  <!-- Subtle Inner Ring Highlight -->
  <rect x="3" y="3" width="122" height="122" rx="31" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2"/>

  <!-- Grocery Basket Silhouette & Fresh Produce Group -->
  <g filter="url(#dropShadow)">
    <!-- Fresh Apple in Basket -->
    <circle cx="52" cy="50" r="13" fill="url(#appleGrad)"/>
    <!-- Fresh Citrus / Orange in Basket -->
    <circle cx="76" cy="53" r="11" fill="url(#orangeGrad)"/>

    <!-- Organic Sprouting Leaf Accent -->
    <path d="M64 42 C64 30 76 26 84 27 C83 37 76 43 64 42 Z" fill="url(#leafGrad)"/>
    <path d="M64 42 C70 37 77 34 82 31" stroke="#2E7D32" stroke-width="1.8" stroke-linecap="round" fill="none"/>

    <!-- Basket Top Handle -->
    <path d="M42 56 C42 38 86 38 86 56" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>

    <!-- Woven Grocery Basket Body -->
    <path d="M30 60 L36 94 C37 98 40 101 45 101 L83 101 C88 101 91 98 92 94 L98 60 Z" fill="#FFFFFF"/>

    <!-- Basket Interior Mesh Lines / Slats -->
    <path d="M42 67 L44 94" stroke="#2E7D32" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M64 67 L64 94" stroke="#2E7D32" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M86 67 L84 94" stroke="#2E7D32" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M33 76 L95 76" stroke="#2E7D32" stroke-width="3" stroke-linecap="round"/>
    <path d="M35 87 L93 87" stroke="#2E7D32" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
